<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grant & Application Tracker</title><style>body{margin:0;background:#f7f6f2;color:#28251d;font:16px/1.55 system-ui,sans-serif}header{padding:2.5rem 1.25rem 1rem;max-width:70rem;margin:auto}h1{font-family:Georgia,serif;margin:0 0 .25rem}p{color:#6b6a65}main{max-width:70rem;margin:auto;padding:0 1.25rem 4rem}.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.5rem 0}input,select{padding:.6rem;border:1px solid #dcd9d5;border-radius:.5rem;background:#fff;font:inherit}.count{margin-left:auto;color:#6b6a65;align-self:center}h3.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#6b6a65;margin:2rem 0 .75rem;padding-bottom:.35rem;border-bottom:1px solid #dcd9d5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:1rem}.card{background:#fff;border:1px solid #dcd9d5;border-radius:.75rem;padding:1rem;display:flex;flex-direction:column;gap:.5rem}.card.past{opacity:.6}.card h2{font-size:1.1rem;margin:0}.card p{margin:0}.funder{font-size:.75rem;text-transform:uppercase;color:#6b6a65}.badge{align-self:flex-start;font-size:.75rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;background:#eef4f3;color:#01696f}.badge.overdue{background:#f6e3d8;color:#964219}.badge.soon{background:#f5eed2;color:#8a6d00}.badge.none{background:#eee;color:#6b6a65}.links{margin-top:auto;display:flex;gap:.5rem}.links a{color:#01696f;text-decoration:none;border:1px solid #dcd9d5;padding:.4rem .65rem;border-radius:.45rem}</style></head><body><header><h1>Grant & Application Tracker</h1><p>In-progress grant, residency, exhibition, and funding applications.</p></header><main><div class="toolbar"><input id="q" placeholder="Search applications"><select id="funder"><option value="">All funders</option></select><span class="count" id="count"></span></div><div id="apps"></div></main><script>const APPS=[
{title:"Media Artists Creation Projects",funder:"Ontario Arts Council",path:"oac/media-artists-creation-projects",due:"2026-10-08",status:"Not started",url:"https://www.arts.on.ca/grants/media-artists-creation-projects"},
{title:"Grants to Organizations and Groups",funder:"Nova Scotia Arts",path:"ns-arts/grants-organizations-and-groups",due:"2026-10-15",status:"Not started",url:"https://artsns.ca/programs/grants-organizations-and-groups"},
{title:"Media Artists Program: Creation",funder:"Toronto Arts Council",path:"toronto-arts-council/media-artists-program-creation",due:"2026-10-15",status:"Not started",url:"https://torontoartscouncil.org/grants/media-artists-program-creation/"},
{title:"Visual Arts Projects: Groups",funder:"Ontario Arts Council",path:"oac/visual-arts-projects-groups",due:"2026-10-28",status:"Not started",url:"https://www.arts.on.ca/grants/visual-arts-projects"},
{title:"Northern Arts Projects",funder:"Ontario Arts Council",path:"oac/northern-arts-projects",due:"2026-10-29",status:"Not started",url:"https://www.arts.on.ca/grants/northern-arts-projects"},
{title:"Canada Book Fund: Support for Organizations",funder:"Canadian Heritage",path:"canadian-heritage/canada-book-fund-support-for-organizations",due:"2026-11-01",status:"Not started",url:"https://www.canada.ca/en/canadian-heritage/services/funding/book-fund/support-organizations.html"},
{title:"Visual Art Creation Projects",funder:"Ontario Arts Council",path:"oac/visual-art-project-creation",due:"2026-11-03",status:"Not started",url:""},
{title:"Visual Artists Creation Projects",funder:"Ontario Arts Council",path:"oac/visual-artists-creation-projects",due:"2026-11-03",status:"Not started",url:"https://www.arts.on.ca/grants/visual-artists-creation-projects"},
{title:"Music Recording Projects",funder:"Ontario Arts Council",path:"oac/music-recording-projects",due:"2026-11-05",status:"Not started",url:"https://www.arts.on.ca/grants/music-recording-projects"},
{title:"Residency",funder:"Est-Nord-Est",path:"est-nord-est/residency",due:"2026-11-08",status:"Not started",url:"https://estnordest.org/residence-artistes/"},
{title:"Grants to Individuals",funder:"Nova Scotia Arts",path:"ns-arts/grants-individuals",due:"2026-11-15",status:"Not started",url:"https://artsns.ca/programs/grants-individuals"},
{title:"Exhibit Proposals",funder:"Inverness Arts",path:"inverness-arts/exhibit-proposals",due:"2026-11-15",status:"Not started",url:"https://www.invernessarts.com/exhibit-proposals"},
{title:"Composite Activities",funder:"Canada Council for the Arts",path:"canada-council/composite-activities",due:"2026-11-25",status:"Not started",url:"https://www.arts-services.ca/s/fundingopportunity/119JQ000003Vz5YYAS/4007?language=en_US"},
{title:"Residency 2028",funder:"Jan van Eyck Academy",path:"jan-van-eyck-academy/residency-2028",due:"2026-12-01",status:"Not started",url:"https://www.janvaneyck.nl/calendar/apply-now-jve-residency-2028"},
{title:"Visual Arts and New Media Individual Project Funding",funder:"Alberta Foundation for the Arts",path:"alberta-foundation-for-the-arts/visual-arts-and-new-media-individual-project-funding",due:"2027-03-01",status:"Not started",url:"https://www.affta.ab.ca/funding/find-funding/visual-arts-and-new-media-individual-project-funding"},
{title:"Visual Artists Program: Creation",funder:"Toronto Arts Council",path:"toronto-arts-council/visual-artists-program-creation",due:"",status:"Not started",url:"https://torontoartscouncil.org/grants/visual-artists-program-creation/"},
{title:"Sector Support: Innovation and Development",funder:"Canada Council for the Arts",path:"canada-council/sector-support-innovation-and-development",due:"",status:"Not started",url:"https://www.arts-services.ca/s/fundingopportunity/119JQ000003Vz3pYAC/4002?language=en_US"},
{title:"Artistic Creation",funder:"Canada Council for the Arts",path:"canada-council/artistic-creation",due:"",status:"Not started",url:"https://www.arts-services.ca/s/fundingopportunity/119JQ000003Vz5ZYAS/1006?language=en_US"},
{title:"Micro Grants",funder:"Canada Council for the Arts",path:"canada-council/micro-grants",due:"",status:"Not started",url:"https://www.arts-services.ca/s/fundingopportunity/119JQ000003Vz5XYAS/6601?language=en_US"},
{title:"Representation and Promotion (Travel)",funder:"Canada Council for the Arts",path:"canada-council/representation-and-promotion-travel",due:"",status:"Not started",url:"https://www.arts-services.ca/s/fundingopportunity/119JQ000003Vz5WYAS/6602?language=en_US"},
{title:"International Residencies",funder:"Canada Council for the Arts",path:"canada-council/international-residencies",due:"",status:"In progress",url:"https://www.arts-services.ca/s/fundingopportunity/119JQ000003Vz5fYAC/6605?language=en_US"},
{title:"Art Gallery Submissions",funder:"StFX Art Gallery",path:"stfx-art-gallery/submissions",due:"",status:"Not started",url:"https://www.stfx.ca/art-gallery/submissions"}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date();today.setHours(0,0,0,0);
const dayOf=a=>Math.round((new Date(a.due+'T00:00:00')-today)/864e5);
function dueInfo(a){if(!a.due)return{label:'No deadline listed',cls:'none'};const days=dayOf(a);let label=a.due,cls='';if(days<0){label+=' · passed '+Math.abs(days)+' days ago';cls='overdue'}else if(days===0){label+=' · due today';cls='soon'}else if(days<=14){label+=' · '+days+' days left';cls='soon'}return{label,cls}}
function card(a,past){const d=dueInfo(a);return '<article class="card'+(past?' past':'')+'"><span class="funder">'+esc(a.funder)+'</span><h2>'+esc(a.title)+'</h2><span class="badge '+d.cls+'">'+esc(a.status)+'</span><p>Due: '+esc(d.label)+'</p><div class="links"><a href="'+esc(a.path)+'/">Open application</a>'+(a.url?'<a href="'+esc(a.url)+'" target="_blank" rel="noopener">Program page</a>':'')+'</div></article>'}
function section(t,items,past){return items.length?'<h3 class="sec">'+t+' ('+items.length+')</h3><div class="grid">'+items.map(a=>card(a,past)).join('')+'</div>':''}
function render(){const q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('funder').value,list=APPS.filter(a=>(!f||a.funder===f)&&(a.title+' '+a.funder).toLowerCase().includes(q)),byDue=(a,b)=>a.due.localeCompare(b.due)||a.funder.localeCompare(b.funder);
const upcoming=list.filter(a=>a.due&&dayOf(a)>=0).sort(byDue),none=list.filter(a=>!a.due).sort((a,b)=>a.funder.localeCompare(b.funder)||a.title.localeCompare(b.title)),past=list.filter(a=>a.due&&dayOf(a)<0).sort((a,b)=>b.due.localeCompare(a.due));
document.getElementById('apps').innerHTML=section('Upcoming deadlines',upcoming,false)+section('No deadline listed',none,false)+section('Past deadlines',past,true);
document.getElementById('count').textContent=list.length+' of '+APPS.length}
const fs=[...new Set(APPS.map(a=>a.funder))].sort();
document.getElementById('funder').innerHTML+=fs.map(x=>'<option>'+esc(x)+'</option>').join('');
document.getElementById('q').oninput=render;document.getElementById('funder').onchange=render;render();</script></body></html>
